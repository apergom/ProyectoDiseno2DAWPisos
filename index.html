<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de tareas · Planificador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/guardia.js"></script>
</head>
<body class="app">
  <header class="cabecera">
    <p class="cabecera__marca">Piso Calle Mayor</p>
  </header>

  <main class="contenido">
    <section aria-labelledby="titulo-panel">
      <h1 id="titulo-panel">Tareas de esta semana</h1>
      <p class="subtitulo" id="resumen">Semana del 13 al 19</p>

      <div class="progreso">
        <div class="progreso__pista">
          <div class="progreso__relleno" id="progreso-relleno"></div>
        </div>
        <p class="progreso__texto" id="progreso-texto"></p>
      </div>

      <form class="filtros" id="filtros">
        <div class="campo">
          <label for="filtro-categoria">Categoría</label>
          <select id="filtro-categoria" name="categoria">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-persona">Persona</label>
          <select id="filtro-persona" name="persona">
            <option value="">Todas</option>
          </select>
        </div>
        <button class="boton filtros__buscar" type="submit">Buscar</button>
        <button class="filtros__limpiar" id="filtro-limpiar" type="button">Limpiar</button>
      </form>

      <ul class="listado" id="listado"></ul>

      <a class="boton boton--inline" href="nueva-tarea.html">Nueva tarea</a>
    </section>
  </main>

  <nav class="navegacion" aria-label="Secciones de la app">
    <ul>
      <li><a href="index.html" aria-current="page">Tareas</a></li>
      <li><a href="calendario.html">Calendario</a></li>
      <li><a href="chat.html">Chat</a></li>
      <li><a href="grupo.html">Grupo</a></li>
      <li><a href="registro.html">Registro</a></li>
      <li><a href="contacto.html">Contacto</a></li>
      <li><a href="mensajes.html">Mensajes</a></li>
    </ul>
  </nav>

  <script type="module" src="js/sesion.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
